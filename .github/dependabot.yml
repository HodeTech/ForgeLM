# Dependabot configuration for ForgeLM.
#
# Dependabot opens a pull request when a dependency's declared range no longer
# covers the newest release. It is the upstream half of the supply-chain story:
# `tools/check_pip_audit.py` and the nightly CVE job catch known advisories, and
# these pull requests make a fix reachable.
#
# No `versioning-strategy` is set for `pip`. The `pip` ecosystem accepts only `auto`,
# `increase`, `increase-if-necessary` and `lockfile-only`; a previous `widen` is not
# among them, GitHub rejected the whole file ("did not match one of the following
# values"), and while it did not parse Dependabot opened nothing. ForgeLM declares
# bounded ranges (`>=floor,<next-major`) with no lockfile, so the default (`auto`) may
# raise a floor the ceiling already covers instead of admitting a new major; look at the
# first pull requests and tighten this then.
#
# `ruff`, `mypy` and `bandit` are ignored on purpose. They are blocking CI gates
# and `tests/test_packaging.py` requires their `[dev]` range to equal the one
# `ci.yml`'s lint job installs. Dependabot edits only `pyproject.toml`, so a bump
# would fail that test the moment it arrived. Those three are raised deliberately,
# in one commit, with the CI pin moved in step.

version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "area: packaging-ci"
    commit-message:
      prefix: "chore(deps)"
    ignore:
      - dependency-name: "ruff"
      - dependency-name: "mypy"
      - dependency-name: "bandit"
    groups:
      python-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "area: packaging-ci"
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
