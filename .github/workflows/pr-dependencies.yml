name: PR dependencies

# The required "Issue dependencies" check: fails while the pull request's description links (Fixes / Closes /
# Resolves / Refs #N) an issue that is still blocked, unless the same pull request closes every open blocker or a
# maintainer has labelled it `dependency-override`. Rules: tools/issue_dependencies.py and CONTRIBUTING.md,
# "Dependencies between issues". When a blocker is closed, the "Issue dependencies" workflow re-runs this check.
#
# The pull request's code never runs here: the checkout takes the base commit's copy of the script, so a pull
# request cannot change the check that judges it. The token is read-only, which is all a fork's pull request gets
# anyway. tests/test_issue_dependencies.py pins these properties:
#   - `pull_request` only (never `pull_request_target`), no `paths:` filter (a required check must always report);
#   - the token holds `contents: read`, `issues: read` and `pull-requests: read`, nothing else;
#   - the checkout takes the base SHA, one file, no stored credentials, pinned to a full commit SHA;
#   - no `${{ }}` appears in a `run:` line; the script reads the event file itself.

on:
  pull_request:
    types: [opened, edited, reopened, synchronize, ready_for_review, labeled, unlabeled]

permissions: {}

jobs:
  issue-dependencies:
    name: Issue dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read        # the checkout reads one script from the base commit
      issues: read          # read the linked issues and their "Blocked by" links
      pull-requests: read   # read the pull request's current description and labels
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
          sparse-checkout: tools/issue_dependencies.py
          sparse-checkout-cone-mode: false
      - name: Fail if a linked issue is still blocked
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/issue_dependencies.py check-pr
